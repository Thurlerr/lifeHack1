name: Deploy Blazor PWA to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publicar Blazor WebAssembly Standalone
      run: dotnet publish LifeHacks.csproj -c Release -o release

    - name: Ajustar Base Path e Roteamento para GitHub Pages
      run: |
        # 1. Determina se o repositório é página de usuário ou de projeto
        REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
        if [[ "${{ github.repository }}" == *".github.io" ]]; then
          BASE_PATH="/"
        else
          BASE_PATH="/$REPO_NAME/"
        fi
        echo "Configurando <base href=\"$BASE_PATH\" /> no index.html"
        sed -i "s|<base href=\"/\" />|<base href=\"$BASE_PATH\" />|g" release/wwwroot/index.html

        # 2. Recalcula o hash do index.html no service-worker-assets.js para garantir integridade perfeita
        if [ -f release/wwwroot/service-worker-assets.js ]; then
          NEW_HASH="sha256-$(openssl dgst -sha256 -binary release/wwwroot/index.html | openssl base64 -A)"
          sed -i -E "s|\"hash\": \"[^\"]+\",(\s*\"url\": \"index\.html\")|\"hash\": \"$NEW_HASH\",\1|g" release/wwwroot/service-worker-assets.js
        fi

        # 3. Cria 404.html para que o Blazor gerencie o roteamento SPA sem telas de erro do GitHub
        cp release/wwwroot/index.html release/wwwroot/404.html

        # 4. Cria arquivo .nojekyll para evitar que o GitHub Pages bloqueie a pasta _framework
        touch release/wwwroot/.nojekyll

    - name: Configurar GitHub Pages
      uses: actions/configure-pages@v5

    - name: Fazer Upload do Artefato
      uses: actions/upload-pages-artifact@v3
      with:
        path: release/wwwroot

    - name: Publicar no GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
